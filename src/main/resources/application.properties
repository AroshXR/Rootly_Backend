spring.application.name=Rootly
server.port=${PORT:8080}

# This first API uses a public data provider; no database connection is required.
# Remove these exclusions when implementing database-backed features.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration

rootly.explore.wikidata-url=${WIKIDATA_URL:https://query.wikidata.org/sparql}
rootly.explore.user-agent=${WIKIDATA_USER_AGENT:RootlyBackend/0.1 (Sri Lanka heritage explorer)}
rootly.explore.connect-timeout=${EXPLORE_CONNECT_TIMEOUT:5s}
rootly.explore.request-timeout=${EXPLORE_REQUEST_TIMEOUT:25s}
rootly.explore.cache-ttl=${EXPLORE_CACHE_TTL:15m}
rootly.explore.max-stale=${EXPLORE_MAX_STALE:24h}
rootly.explore.allowed-origin-patterns=${ROOTLY_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

