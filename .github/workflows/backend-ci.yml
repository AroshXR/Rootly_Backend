name: Backend CI

on:
  push:
    branches:
      - prod_release
      - merge_section

  pull_request:
    branches:
      - prod_release
      - merge_section

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean test